<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Helios Network</title>
    <style>
        /* Make the container fill the entire screen */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; /* Dark background to make nodes pop */
        }
        #netviz {
            width: 100%;
            height: 100%;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "helios-web": "https://cdn.jsdelivr.net/npm/helios-web/+esm",
                "helios-network": "https://cdn.jsdelivr.net/npm/helios-network/+esm"
            }
        }
</script>
</head>
<body>

    <!-- Container for the network -->
    <div id="netviz"></div>

    <!-- Script must be type="module" to use ES6 imports -->
    <script type="module">
        import HeliosNetwork from "helios-network";
        import { Helios } from "helios-web";

        const network = await HeliosNetwork.create({ directed: false });

        const nodes = network.addNodes(6);
        network.addEdges([
        [nodes[0], nodes[1]],
        [nodes[1], nodes[2]],
        [nodes[2], nodes[3]],
        [nodes[3], nodes[4]],
        [nodes[4], nodes[5]],
        [nodes[5], nodes[0]],
        [nodes[0], nodes[3]],
        ]);


        const helios = new Helios(network, {
        container: document.getElementById('netviz'),
        mode: '2d',
        });

    
        await helios.ready;
        await new Promise((resolve) => setTimeout(resolve, 900));
        helios.frameNetwork({ animate: false });
    </script>
</body>
</html>
